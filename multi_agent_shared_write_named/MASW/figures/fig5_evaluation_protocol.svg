<text x="448" y="398" class="tiny">attack writes = 0</text>
<path d="M320 270 L370 270 L370 382 L430 382" class="line"/>
<rect x="430" y="500" width="240" height="104" rx="12" fill="#D0E0F0" stroke="#2F3A45" stroke-width="1.25"/>
<text x="448" y="538" class="label">RQ3 Ablation</text>
<text x="448" y="568" class="tiny">ALL F1 = 1.0000</text>
<path d="M320 270 L370 270 L370 552 L430 552" class="line"/>
<rect x="760" y="160" width="240" height="104" rx="12" fill="#FAD7C5" stroke="#2F3A45" stroke-width="1.25"/>
