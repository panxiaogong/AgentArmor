<text x="778" y="228" class="tiny">D3 hybrid + D4 rule</text>
<path d="M670 212 L760 212" class="line"/>
<rect x="760" y="330" width="240" height="104" rx="12" fill="#FAD7C5" stroke="#2F3A45" stroke-width="1.25"/>
