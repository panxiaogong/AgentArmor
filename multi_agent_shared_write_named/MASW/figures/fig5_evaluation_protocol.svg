<text x="128" y="788" class="tiny">ablation_metrics.csv </text>
<text x="128" y="810" class="tiny"> tech_selection_metrics.csv </text>
<text x="128" y="832" class="tiny"> baseline_comparison_metrics.csv </text>
<text x="128" y="854" class="tiny"> e2e_attack_validation_report.md</text>
</svg>
