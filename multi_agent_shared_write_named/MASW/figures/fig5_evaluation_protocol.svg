<text x="778" y="568" class="tiny">MASW exec = 0 / 8</text>
<path d="M670 552 L760 552" class="line"/>
<rect x="1120" y="180" width="360" height="170" rx="12" fill="#EFF2F5" stroke="#2F3A45" stroke-width="1.25"/>
<text x="1138" y="218" class="label">Metrics</text>
<text x="1138" y="248" class="tiny">Precision, Recall, F1, FPR</text>
<text x="1138" y="270" class="tiny">P50 / P95 / P99 ms</text>
<text x="1138" y="292" class="tiny">TP, FP, FN, TN</text>
<rect x="1120" y="450" width="360" height="170" rx="12" fill="#EFF2F5" stroke="#2F3A45" stroke-width="1.25"/>
